# Realistic latency from source publication to the moment the system could
# act. Used for point-in-time entry on backfilled events, where ts_ingested is
# the backfill time rather than the live ingestion time.
sources:
  uw:
    latency_seconds: 120
    poll_seconds: 60
    expected_interval_minutes: 30     # watchdog staleness threshold (market hours)
  edgar:
    latency_seconds: 60
    poll_seconds: 60
    live_forms: ["8-K", "4", "SC 13D"]
    expected_interval_minutes: 60
    max_requests_per_second: 8        # SEC fair access: <= 10 req/s
  usaspending:
    latency_seconds: 3600
    expected_interval_minutes: 1440
  prices:
    latency_seconds: 0
    expected_interval_minutes: 1440
# ts_ingested more than this long after ts_published marks a backfilled row.
backfill_threshold_hours: 24

# Price + point-in-time universe vendor (`loop vendor ...`, and the EOD job when set).
vendor:
  name: sharadar                 # sharadar | none
  api_key_env: NASDAQ_DATA_LINK_API_KEY
  # Security categories kept in the research universe (delisted names included).
  equity_categories_prefix: ["Domestic Common Stock"]
  # Universe snapshots are point-in-time rows the harness reads "as of the last
  # row before the decision day". Weekly keeps the table ~5x smaller than daily.
  universe_snapshot: weekly      # weekly | daily
  eod_lookback_days: 10          # EOD job re-pulls this many days (vendor revisions)
  sharadar:
    base_url: https://data.nasdaq.com/api/v3/datatables/SHARADAR
    page_rows: 10000
    ticker_chunk: 100
    # DAILY.marketcap units. "auto" detects millions vs dollars from the data.
    marketcap_unit: auto
